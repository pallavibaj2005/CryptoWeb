<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Trading Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0b0e11;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
      color: #00ffb3;
      text-shadow: 0 0 10px #00ffb3;
    }

    #controls {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 15px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background-color: #1f2937;
      color: #f5f5f5;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #00ffb3;
      color: #0b0e11;
      box-shadow: 0 0 15px #00ffb3;
      transform: translateY(-2px);
    }

    #output {
      margin-top: 40px;
      background-color: #111827;
      border-radius: 10px;
      padding: 20px;
      width: 85%;
      min-height: 200px;
      overflow-y: auto;
      box-shadow: 0 0 10px #00ffb3;
      color: #d1d5db;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
    }

    li {
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }

    h3 {
      color: #00ffb3;
      margin-bottom: 10px;
    }

    @media (max-width: 700px) {
      #controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      #controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>💹 Crypto Trading Dashboard</h1>
  <div id="controls">
    <button id="testBackend">Test Backend</button>
    <button id="showTop10">Show Top 10 Cryptos</button>
    <button id="getHistory">Get History</button>
    <button id="buyCrypto">Buy Crypto</button>
    <button id="sellCrypto">Sell Crypto</button>
    <button id="viewPortfolio">View Portfolio</button>
    <button id="viewTransactions">View Transactions</button>
  </div>

  <div id="output">💬 Output will appear here...</div>

  <script src="script.js"></script>
</body>
</html>
